<div class="p-6 max-w-lg w-full flex flex-col gap-5 max-h-[90vh] overflow-y-auto">
  <div class="flex items-start justify-between gap-4 border-b border-border pb-4">
    <div class="flex flex-col gap-1">
      <h2 class="text-lg font-semibold text-foreground">{{ data.title }}</h2>
      @if (data.subtitle) {
        <p class="text-sm text-muted-foreground">{{ data.subtitle }}</p>
      }
    </div>
    <button
      type="button"
      (click)="onCancel()"
      class="p-1.5 rounded-lg text-muted-foreground hover:bg-muted transition-colors"
      aria-label="Fechar modal"
    >
      ✕
    </button>
  </div>

  <app-generic-crud-form
    [schema]="data.schema"
    [initialData]="data.initialData ?? null"
    [submitting]="submitting()"
    (formSubmit)="onSave($event)"
    (formCancel)="onCancel()"
  ></app-generic-crud-form>
</div>
