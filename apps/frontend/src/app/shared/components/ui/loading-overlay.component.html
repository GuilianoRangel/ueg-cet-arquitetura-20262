@if (loadingService.isLoading()) {
  <div
    class="backdrop-blur-xs bg-background/60 fixed inset-0 z-[100] flex items-center justify-center"
    role="status"
    aria-live="polite"
    aria-busy="true"
  >
    <div
      class="bg-card text-foreground border border-border rounded-2xl shadow-elevated px-6 py-4 flex items-center gap-3"
    >
      <svg
        class="h-5 w-5 text-primary animate-spin"
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
        aria-hidden="true"
      >
        <circle
          class="opacity-25"
          cx="12"
          cy="12"
          r="10"
          stroke="currentColor"
          stroke-width="4"
        ></circle>
        <path
          class="opacity-75"
          fill="currentColor"
          d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
        ></path>
      </svg>
      <span class="text-sm font-medium">Processando...</span>
    </div>
  </div>
}
