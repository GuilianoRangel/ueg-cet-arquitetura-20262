@if (authService.isAuth()) {
  <ui-shell>
    <app-header
      [showSidebarToggle]="true"
      [sidebarCollapsed]="sidebarCollapsed()"
      (menuToggle)="toggleSidebar()"
    ></app-header>

    <app-sidebar
      [collapsed]="sidebarCollapsed()"
      [mobileOpen]="mobileSidebarOpen()"
      (closeMobile)="closeMobileSidebar()"
    ></app-sidebar>

    <router-outlet></router-outlet>
  </ui-shell>
} @else {
  <div class="flex flex-col min-h-screen bg-background transition-colors duration-200">
    <app-header [showSidebarToggle]="false"></app-header>
    <main class="flex-1 relative flex flex-col">
      <router-outlet></router-outlet>
    </main>
  </div>
}

<ui-loading-overlay></ui-loading-overlay>
<ui-toast></ui-toast>
